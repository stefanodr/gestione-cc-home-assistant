# Esempi di automazioni Gestione C/C.
# Prima di importare: verifica gli entity_id effettivi in
# Impostazioni > Dispositivi e servizi > Gestione C/C.
# Sostituisci notify.notify con il servizio notifiche del tuo dispositivo.

- id: gestione_cc_app_offline
  alias: "Gestione C/C - applicazione non disponibile"
  description: "Avvisa quando il server Gestione C/C risulta offline."
  triggers:
    - trigger: state
      entity_id: binary_sensor.gestione_cc_applicazione_online
      to: "off"
      for: "00:01:00"
    - trigger: state
      entity_id: binary_sensor.gestione_cc_app_online
      to: "unavailable"
      for: "00:01:00"
  actions:
    - action: notify.notify
      data:
        title: "Gestione C/C"
        message: "L'applicazione Gestione C/C non risulta raggiungibile."
  mode: single

- id: gestione_cc_database_integrity
  alias: "Gestione C/C - controllo integrità non superato"
  description: "Avvisa se l'ultimo controllo del database segnala un problema."
  triggers:
    - trigger: state
      entity_id: binary_sensor.gestione_cc_database_integrity
      to: "off"
  actions:
    - action: notify.notify
      data:
        title: "Gestione C/C"
        message: "Il controllo di integrità del database non è superato. Apri l'app e verifica."
  mode: single

- id: gestione_cc_spazio_basso
  alias: "Gestione C/C - spazio disponibile basso"
  description: "Avvisa quando lo spazio libero scende sotto 2 GB."
  triggers:
    - trigger: numeric_state
      entity_id: sensor.gestione_cc_storage_free
      below: 2147483648
  actions:
    - action: notify.notify
      data:
        title: "Gestione C/C"
        message: "Lo spazio libero sul volume dati è inferiore a 2 GB."
  mode: single

- id: gestione_cc_ocr_errori
  alias: "Gestione C/C - errori OCR"
  description: "Avvisa quando viene rilevato almeno un errore OCR."
  triggers:
    - trigger: numeric_state
      entity_id: sensor.gestione_cc_ocr_failed
      above: 0
  actions:
    - action: notify.notify
      data:
        title: "Gestione C/C"
        message: "Sono presenti elaborazioni OCR non riuscite. Apri Gestione C/C per verificare."
  mode: single

- id: gestione_cc_processi_falliti
  alias: "Gestione C/C - processi non riusciti"
  description: "Avvisa quando un processo in background termina con errore."
  triggers:
    - trigger: numeric_state
      entity_id: sensor.gestione_cc_jobs_failed
      above: 0
  actions:
    - action: notify.notify
      data:
        title: "Gestione C/C"
        message: "È presente almeno un processo non riuscito negli ultimi 7 giorni. Apri l'app per verificare."
  mode: single
