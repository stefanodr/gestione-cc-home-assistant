# Esempi di automazioni Gestione C/C.
# Prima di importare: verifica gli entity_id effettivi in
# Impostazioni > Dispositivi e servizi > Gestione C/C.
# Sostituisci notify.notify con il servizio notifiche del tuo dispositivo.

- id: gestione_cc_app_offline
  alias: "Gestione C/C - applicazione non disponibile"
  description: "Avvisa quando il server Gestione C/C risulta offline."
  triggers:
    - trigger: state
      entity_id: binary_sensor.gestione_cc_app_online
      to: "off"
      for: "00:01:00"
    - trigger: state
      entity_id: binary_sensor.gestione_cc_app_online
      to: "unavailable"
      for: "00:01:00"
  actions:
    - action: notify.notify
      data:
        title: "Gestione C/C"
        message: "L'applicazione Gestione C/C non risulta raggiungibile."
  mode: single

- id: gestione_cc_database_integrity
  alias: "Gestione C/C - controllo integrità non superato"
  description: "Avvisa se l'ultimo controllo del database segnala un problema."
  triggers:
    - trigger: state
      entity_id: binary_sensor.gestione_cc_database_integrity
      to: "off"
  actions:
    - action: notify.notify
      data:
        title: "Gestione C/C"
        message: "Il controllo di integrità del database non è superato. Apri l'app e verifica."
  mode: single

- id: gestione_cc_spazio_basso
  alias: "Gestione C/C - spazio disponibile basso"
  description: "Avvisa quando lo spazio libero scende sotto 2 GB."
  triggers:
    - trigger: numeric_state
      entity_id: sensor.gestione_cc_storage_free
      below: 2147483648
  actions:
    - action: notify.notify
      data:
        title: "Gestione C/C"
        message: "Lo spazio libero sul volume dati è inferiore a 2 GB."
  mode: single

- id: gestione_cc_ocr_errori
  alias: "Gestione C/C - errori OCR"
  description: "Avvisa quando viene rilevato almeno un errore OCR."
  triggers:
    - trigger: numeric_state
      entity_id: sensor.gestione_cc_ocr_failed
      above: 0
  actions:
    - action: notify.notify
      data:
        title: "Gestione C/C"
        message: "Sono presenti elaborazioni OCR non riuscite. Apri Gestione C/C per verificare."
  mode: single

- id: gestione_cc_processi_falliti
  alias: "Gestione C/C - processi non riusciti"
  description: "Avvisa quando un processo in background termina con errore."
  triggers:
    - trigger: numeric_state
      entity_id: sensor.gestione_cc_jobs_failed
      above: 0
  actions:
    - action: notify.notify
      data:
        title: "Gestione C/C"
        message: "È presente almeno un processo non riuscito negli ultimi 7 giorni. Apri l'app per verificare."
  mode: single

- id: gestione_cc_google_drive_disconnesso
  alias: "Gestione C/C - Google Drive scollegato"
  description: "Avvisa una sola volta quando l'autorizzazione Google Drive non è più valida."
  triggers:
    - trigger: state
      entity_id: binary_sensor.gestione_cc_google_drive_connected
      to: "off"
  actions:
    - action: notify.mobile_app_cell_stefano
      data:
        title: "Gestione C/C - Google Drive"
        message: "Google Drive risulta scollegato o l'autorizzazione è scaduta. Ricollega Google Drive in Impostazioni > Backup · Google Drive."
  mode: single

- id: gestione_cc_google_drive_backup_fallito
  alias: "Gestione C/C - backup Google Drive non riuscito"
  description: "Avvisa se il backup notturno fallisce mentre Google Drive risulta collegato."
  triggers:
    - trigger: state
      entity_id: binary_sensor.gestione_cc_google_drive_backup_failed
      to: "on"
  conditions:
    - condition: state
      entity_id: binary_sensor.gestione_cc_google_drive_connected
      state: "on"
  actions:
    - action: notify.mobile_app_cell_stefano
      data:
        title: "Gestione C/C - backup non riuscito"
        message: "Il backup notturno su Google Drive non è riuscito. Verifica la connessione e lo spazio disponibile su Drive."
  mode: single

- id: gestione_cc_google_drive_backup_mancante
  alias: "Gestione C/C - backup Google Drive mancante"
  description: "Avvisa se, dopo le 04:00, il backup notturno del giorno non risulta completato."
  triggers:
    - trigger: state
      entity_id: binary_sensor.gestione_cc_google_drive_backup_overdue
      to: "on"
  actions:
    - action: notify.mobile_app_cell_stefano
      data:
        title: "Gestione C/C - backup mancante"
        message: "Il backup notturno su Google Drive non risulta completato entro le 04:00. Controlla Gestione C/C."
  mode: single
