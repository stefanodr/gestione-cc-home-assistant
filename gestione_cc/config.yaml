name: "Gestione C/C"
slug: "gestione_cc"
description: "Gestione C/C privata, con archivio centralizzato e accesso LAN autenticato"
version: "1.0.27"
url: "https://github.com/stefanodr/gestione-cc-home-assistant"
webui: "https://[HOST]:[PORT:8443]"
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
host_network: false
ingress: false
ports:
  8443/tcp: 8443
ports_description:
  8443/tcp: "Interfaccia web Gestione C/C protetta HTTPS (rete locale)"
options:
  admin_username: "admin"
  bootstrap_pin: ""
  hostname: "homeassistant.local"
  lan_network: "192.168.1.0/24"
schema:
  admin_username: str
  bootstrap_pin: password
  hostname: str
  lan_network: str
