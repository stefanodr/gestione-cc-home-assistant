<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#132d2b">
<meta name="robots" content="noindex,nofollow">
<title>Accesso smartphone · Gestione C/C</title>
<link rel="icon" type="image/svg+xml" href="/brand-logo.svg">
<link rel="stylesheet" href="/mobile-login.css">
</head>
<body>
<main class="mobile-login-card">
<img src="/brand-logo.svg" alt="" width="68" height="68">
<p class="eyebrow">AREA PERSONALE · CONSULTAZIONE</p>
<h1>Gestione C/C</h1>
<p class="intro">Accedi alla versione smartphone in sola lettura.</p>
<form id="mobileLoginForm">
<label for="mobilePin">PIN amministratore</label>
<input id="mobilePin" name="pin" type="password" inputmode="numeric" pattern="[0-9]{6}" minlength="6" maxlength="6" autocomplete="one-time-code" aria-label="PIN di 6 cifre" required autofocus>
<p id="mobileLoginError" role="alert" aria-live="polite"></p>
<button id="mobileLoginSubmit" type="submit">Accedi</button>
</form>
<p class="readonly-note">Questa modalità consente esclusivamente di consultare i dati. Non permette di inserire, modificare o cancellare movimenti.</p>
<a class="ca-link" href="/ca.crt" download>Scarica il certificato CA per questo dispositivo</a>
</main>
<script src="/mobile-login.js" defer></script>
</body>
</html>
