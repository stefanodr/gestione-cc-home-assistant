name: Integration API security tests

on:
  push:
    branches:
      - feature/ha-integration-v1.1-foundation
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  integration-api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check custom integration Python and add-on shell syntax
        run: |
          python -m compileall -q custom_components/gestione_cc
          bash -n gestione_cc/run.sh
      - name: Validate integration JSON files
        run: |
          python -c "import json,pathlib; [json.loads(p.read_text(encoding='utf-8')) for p in pathlib.Path('custom_components/gestione_cc').rglob('*.json')]"
          python -c "import json,pathlib; json.loads(pathlib.Path('hacs.json').read_text(encoding='utf-8')); m=json.loads(pathlib.Path('gestione_cc/www/manifest.webmanifest').read_text(encoding='utf-8')); assert m['display']=='standalone' and m['start_url']=='/' and {'192x192','512x512'} <= {i['sizes'] for i in m['icons']}"
      - name: Validate Home Assistant YAML examples
        run: |
          python -m pip install --quiet PyYAML
          python -c "import pathlib,yaml; [yaml.safe_load(pathlib.Path(p).read_text(encoding='utf-8')) for p in ['gestione_cc/config.yaml','docs/dashboard_gestione_cc.yaml','docs/automazioni_gestione_cc.yaml']]"
      - name: Run restricted DTO and privacy tests
        run: python -m unittest discover -s tests -p 'test_integration_*.py' -v
