name: Validate finance feature

on:
  push:
    branches:
      - feature/analisi-budget-previsioni
      - feature/prossima-versione-migliorie
      - feature/document-archive-ocr
      - feature/document-exports-forecast
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Check JavaScript syntax
        run: node --check gestione_cc/www/app.js
      - name: Check Python syntax
        run: python -m py_compile gestione_cc/server.py
      - name: Test document OCR helpers
        run: python tests/test_document_ocr.py
      - name: Test transaction audit history
        run: python tests/test_transaction_audit.py
      - name: Test OFX parser
        run: node tests/finance-import.test.js
      - name: Install DOM test dependency
        run: npm install --no-save --no-package-lock jsdom@26
      - name: Test global privacy modes
        run: node tests/privacy-ui.test.js
      - name: Build Home Assistant add-on image
        run: docker build --build-arg BUILD_FROM=ghcr.io/home-assistant/amd64-base:latest -t gestione-cc-addon-test gestione_cc
      - name: Verify local PDF and Italian OCR tools
        run: docker run --rm --entrypoint /bin/sh gestione-cc-addon-test -c "command -v pdftotext && command -v pdfinfo && command -v pdftoppm && command -v tesseract && tesseract --list-langs 2>/dev/null | grep -qx ita"
