name: Financial engine tests
on:
  pull_request:
    paths:
      - 'gestione_cc/www/financial-engine.js'
      - 'tests/**'
      - '.github/workflows/financial-engine-tests.yml'
  push:
    branches:
      - 'feature/**'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/financial-engine.test.cjs
