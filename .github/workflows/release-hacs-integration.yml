name: Publish HACS integration release

on:
  push:
    branches: [main]
    paths:
      - "custom_components/gestione_cc/manifest.json"
      - ".github/workflows/release-hacs-integration.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read integration version
        id: version
        run: |
          VERSION="$(python -c "import json; print(json.load(open('custom_components/gestione_cc/manifest.json', encoding='utf-8'))['version'])")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create HACS release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; no changes made."
          else
            gh release create "$TAG" \
              --target main \
              --title "Gestione C/C Home Assistant integration ${{ steps.version.outputs.version }}" \
              --notes "## Gestione C/C Home Assistant integration ${{ steps.version.outputs.version }}

          - Fixed blocking CA certificate loading in Home Assistant's event loop.
          - Loads the verified TLS context in the executor during setup and config flow.
          - Keeps certificate verification enabled.
          - Includes regression tests for non-blocking SSL initialization."
          fi
